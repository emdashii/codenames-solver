# Netlify builds from GitHub on every push (Git integration; no tokens or Actions).
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Netlify installs dependencies with Bun when it finds bun.lockb (see bunfig.toml).
  # Pin the version so builds match local development.
  BUN_VERSION = "1.3.14"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
