<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#262b31" />
    <meta name="description" content="Tap the tiles revealed in your Codenames game and see which key card the spymaster holds. An unofficial helper for the guessing team." />
    <title>Key Card Finder: an unofficial Codenames helper</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codenames.mazzaella.com/" />
    <meta property="og:title" content="Key Card Finder: an unofficial Codenames helper" />
    <meta property="og:description" content="Tap the tiles revealed in your Codenames game and see which key card the spymaster holds." />
    <meta property="og:image" content="https://codenames.mazzaella.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Codenames board in Key Card Finder, showing each unrevealed tile's chance of being your agent." />
    <meta name="twitter:card" content="summary_large_image" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="05154cb7-f825-40a9-960c-13a6fcaed9f7" data-domains="codenames.mazzaella.com"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Key Card Finder</h1>
        <p class="subtitle">an unofficial helper for the Codenames board game</p>
      </header>

      <main>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="board" id="board" role="grid" aria-label="Board, 5 by 5"></div>
        <p class="legend" id="legend"></p>
      </main>

      <section class="controls" aria-label="Game settings">
        <div class="setting">
          <span class="setting-name" id="start-label">Starts</span>
          <div class="segmented" role="radiogroup" aria-labelledby="start-label" data-setting="start">
            <button type="button" role="radio" data-value="R">Red</button>
            <button type="button" role="radio" data-value="B">Blue</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-name" id="me-label">My team</span>
          <div class="segmented" role="radiogroup" aria-labelledby="me-label" data-setting="me">
            <button type="button" role="radio" data-value="R">Red</button>
            <button type="button" role="radio" data-value="B">Blue</button>
          </div>
        </div>
        <div class="actions">
          <button type="button" id="undo">Undo</button>
          <button type="button" id="new-game">New game</button>
        </div>
      </section>

      <footer>
        <p>Unofficial fan tool, not affiliated with Czech Games Edition.</p>
        <p>
          <a href="https://github.com/emdashii/codenames-solver">Source code</a> ·
          <a href="https://mazzaella.com/posts/codenames-key-card-finder/">Write-up</a>
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
